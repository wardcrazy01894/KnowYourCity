name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least-privilege token. gitleaks-action needs to read PR commits on
# pull_request events; without this it 403s ("Resource not accessible by
# integration").
permissions:
  contents: read
  pull-requests: read

jobs:
  # -------------------------------------------------------------------------
  # Build, type-check, lint, format-check the web app.
  # -------------------------------------------------------------------------
  build:
    name: build / typecheck / lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies (locked)
        run: npm ci

      # Informational only (continue-on-error): flag known vulns. This audits
      # dev deps too — it used to pass --omit=dev to mute a since-resolved
      # esbuild/vite advisory, but that blind spot hid five high-severity
      # dev-only advisories until a manual sweep found them (#165). Build
      # tooling is a real supply-chain surface, so it's in scope.
      # Non-blocking so a new advisory never wedges PRs.
      - name: Audit dependencies (informational)
        run: npm audit
        continue-on-error: true

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Lint (eslint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      - name: Build (vite)
        run: npm run build

  # -------------------------------------------------------------------------
  # Unit tests for the deterministic core (daily selection, scoring).
  # -------------------------------------------------------------------------
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies (locked)
        run: npm ci

      - name: Run tests (vitest)
        run: npm test

  # -------------------------------------------------------------------------
  # Secret scan: catch accidentally committed credentials (e.g. a Mapbox token).
  # -------------------------------------------------------------------------
  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so gitleaks can scan all commits on the branch

      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
