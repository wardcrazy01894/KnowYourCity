# Dependabot keeps dependencies patched and surfaces upgrades as PRs, which
# then run the same required CI checks as any other change (see CLAUDE.md).
#
# Grouping policy: minor + patch updates land as ONE batched PR per ecosystem
# so routine bumps stay low-noise on a solo repo. Major updates are excluded
# from the group on purpose — each arrives as its own PR so a breaking upgrade
# (React 19, TypeScript 7, ESLint 10, …) gets reviewed on its own merits.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
    groups:
      npm-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
    groups:
      actions-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
