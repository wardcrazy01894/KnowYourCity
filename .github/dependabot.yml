# Dependabot keeps dependencies patched and surfaces upgrades as PRs, which
# then run the same required CI checks as any other change (see CLAUDE.md).
#
# Grouping policy: minor + patch updates land as ONE batched PR per ecosystem
# so routine bumps stay low-noise on a solo repo. Major updates are excluded
# from the group on purpose — each arrives as its own PR so a breaking upgrade
# gets reviewed on its own merits — ESLint 10 (#167) landed that way, and
# React 19 (#168) is in flight.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # 10, not the default 5: majors are excluded from the group below, so each
    # one takes its own slot, and a small limit can be fully occupied by
    # long-lived major PRs while the batched minor/patch PR — the point of this
    # config — waits. 10 makes that unlikely, but it is not a guarantee (there
    # is no documented ordering between the group PR and individual ones). The
    # real fix is keeping the major backlog short.
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
    groups:
      npm-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      # TypeScript 7 is blocked UPSTREAM, not by this repo. Every published
      # typescript-eslint — including 8.67.1-alpha.29 — pins
      # `peerDependencies.typescript: ">=4.8.4 <6.1.0"`, and forcing the install
      # crashes typescript-estree outright:
      #   TypeError: Cannot read properties of undefined (reading 'Cjs')
      # `npm run lint` then dies, and build/typecheck/lint is a required check,
      # so a TS 7 PR can never go green. Ignored so it doesn't reopen every
      # Monday with the same blocker.
      #
      # TS 7 itself works here — it needs one line, `"types": ["node"]` in
      # tsconfig.json, since it no longer auto-includes @types/node.
      #
      # REMOVE THIS ENTRY once typescript-eslint supports TS 7. See BACKLOG.md.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Left at the default 5 on purpose: only 6 distinct actions are used, and
    # simultaneous action majors are rare and merge quickly.
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
    groups:
      actions-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
